{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h2 class="fw-bold">Student Registration</h2>
    <form method="post">
      <label class="form-label">Student ID</label>
      <input class="form-control mb-3" name="student_id" required>

      <label class="form-label">Full Name</label>
      <input class="form-control mb-3" name="name" required>

      <label class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" required>

      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" minlength="6" required>

      <label class="form-label">Confirm Password</label>
      <input class="form-control mb-3" type="password" name="confirm_password" required>

      <button class="btn btn-primary w-100">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
